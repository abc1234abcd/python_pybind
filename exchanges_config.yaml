exchanges:
  mexc:
    spot:
      socket_url: 
        public: "wss://wbs-api.mexc.com/ws"
        private: "wss://wbs-api.mexc.com/ws?listenKey=${listenKey}" 
      max_subscription: 30
      ping_interval: 30
      max_listenKey: 60
      each_listenKey_perMaxWebsocketConnection: 5
      ping_message: {"method": "PING"}
      topic_template:
          public:
              trades: "spot@public.aggre.deals.v3.api.pb@(100ms|10ms)@${symbol}"
              order_book_limited_depths: "spot@public.limit.depth.v3.api.pb@{symbol}@20"
              kline: "spot@public.kline.v3.api.pb@${symbol}@$Min1"
              book_ticker: "spot@public.aggre.bookTicker.v3.api.pb@(100ms|10ms)@${symbol}"
          private:
              spot_account_upate:  "spot@private.account.v3.api.pb"
              spot_account_deals: "spot@private.deals.v3.api.pb"
              spot_account_orders: spot@private.orders.v3.api.pb"
    future:
      socket_url: 
        public: "wss://contract.mexc.com/edge"
        private: "wss://contract.mexc.com/edge"
      max_subscription: 30
      ping_interval: 30
      max_listenKey: 60
      each_listenKey_perMaxWebsocketConnection: 5
      ping_message: {"method": "ping"}
      topic_template:
          public:
              trades: {"method": "sub.deal", "param": {"symbol": "${symbol}"}}
              ticker: {'method': 'sub.ticker', 'param': {'symbol': '${symbol}' }}
              funding_rate: {'method': 'sub.funding.rate', 'param': {'symbol': '${symbol}'}}
              kline: {"method": "sub.kline", "param": {"symbol": "${symbol}", "interval": "Min1"}}
              index_price: {"method": "sub.index.price", "param": {"symbol": "${symbol}"}}
              fair_price: {"method": "sub.fair.price", "param":{"symbol": "${symbol}"}}
          private:
              order: {"channel": "push.personal.order"}
              asset: {"channel": "push.personal.asset"}
      broker:

